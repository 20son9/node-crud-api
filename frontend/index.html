<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Product Showcase</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #007bff; color: white; }
        input { margin: 5px 0; padding: 8px; width: 100%; box-sizing: border-box; }
        button { padding: 10px 15px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px; margin-top: 10px; }
        button:hover { background: #218838; }
        .delete-btn { background: #dc3545; }
        .delete-btn:hover { background: #c82333; }
        .edit-btn { background: #ffc107; color: black; margin-right: 5px; }
        .form-row { display: flex; gap: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Tech Product Showcase</h2>
        
        <!-- Form for Create and Update -->
        <form id="productForm">
            <input type="hidden" id="productId">
            <div class="form-row">
                <input type="text" id="productName" placeholder="Product Name" required>
                <input type="text" id="category" placeholder="Category" required>
            </div>
            <div class="form-row">
                <input type="number" id="price" placeholder="Price" step="0.01" required>
                <input type="number" id="stockQuantity" placeholder="Stock Quantity" required>
                <input type="text" id="manufacturer" placeholder="Manufacturer" required>
            </div>
            <button type="submit" id="submitBtn">Add Product</button>
        </form>

        <!-- Table to display records -->
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Manufacturer</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="productTableBody">
                <!-- Data will be loaded here via JavaScript -->
            </tbody>
        </table>
    </div>

    <script src="app.js"></script>
</body>
</html>
